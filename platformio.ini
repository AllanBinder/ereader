; Muon Bench E-Reader: ESP32-S3 + Good Display GDEH0576T81 e-paper (5.76 inch,
; 920x680, 1 bit) on a DESPI-C02 adapter.
;
; The RP2040 build was retired on 2026-08-28 (see REBUILD-ESP32-2026-08-28.md).
; The board definition is lolin_s3_mini, which is what the Muon bench ESP32-S3
; boards (N8R2 and Dual Type-C N16R8) both flash as.

[env:esp32s3]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200

board_build.filesystem = littlefs
; Custom table because the stock 4 MB layouts leave well under 1.5 MB for the
; filesystem. See partitions.csv for the map. On an 8 or 16 MB module you can
; grow the books partition: keep nvs/otadata/app0 as they are and extend the
; spiffs entry's size to (flash size - 0x210000), for example 0x5F0000 on 8 MB
; or 0xDF0000 on 16 MB. Add board_upload.flash_size / board_build.flash_size
; if the board definition does not already declare the larger flash.
board_build.partitions = partitions.csv
; Browser emulator page for the games server (src/games.*), gzipped by
; tools/build_www.sh. Linked into the app image so an uploadfs is never
; needed to update it (uploadfs wipes the ROMs and saves on the filesystem).
board_build.embed_files =
    www/dist/index.html.gz
    www/dist/app.js.gz
    www/dist/nes.js.gz
    www/dist/gb.js.gz
; lolin_s3_mini declares 4 MB of flash; this reader's module is an 8 MB N8R2,
; so the size is overridden here. Without it the image header says 4 MB and
; nothing above that address is reachable, which is where the books now live.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; WebServer reads a raw POST body with readBytes(buf, HTTP_RAW_BUFLEN),
    ; which blocks until the buffer is full or the 5 s client timeout hits,
    ; so every body whose last chunk is shorter than the buffer costs 5 s.
    ; Reading one byte at a time removes the stall; the handlers stage bytes
    ; themselves before touching the filesystem.
    -DHTTP_RAW_BUFLEN=1
    ; The news sync runs the mbedTLS handshake on the Arduino loop task, and
    ; verifying the server chain against src/ca_roots.h overflows the stock
    ; 8 KB loop stack: the reader panics mid download with a corrupted
    ; backtrace, reboots, auto syncs and panics again. 16 KB clears it.
    -DARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    olikraus/U8g2_for_Adafruit_GFX
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor
    ; Parses /numbers.json for the Daily numbers grid view (src/numbers_view.*).
    ; Same major as the Muon firmware pins.
    bblanchon/ArduinoJson @ ^7.0.0

; The wide reader: Good Display GDEY0579T93 (5.79 inch, 792x272 bar, two
; SSD1683s in cascade) on a DESPI-C02, on a fresh ESP32-S3 N16R8 board wired
; with jumpers. Same firmware; three things differ from [env:esp32s3]:
;   - DEFAULT_PANEL_ID=2: the panel a board with empty NVS boots (src/panel.h),
;     so a fresh board comes up on the bar without the hold-center boot
;     picker. A choice already stored in NVS still wins, and the Screen menu
;     still switches panels.
;   - PINS_WIDE=1: the jumper build's own pin map (include/pins.h).
;   - N16R8 memory: octal PSRAM (qio_opi; the lolin_s3_mini definition says
;     quad, and a quad build on an octal module does not find its PSRAM) and
;     16 MB of flash, with partitions_16mb.csv: the same table with the books
;     partition extended to the end of flash (0xDF0000). The app slot is
;     unchanged. Room matters here: a book converted for the 5.76 inch panel
;     is re-paginated on the device for the bar, and that needs about twice
;     its text free.
; Panel 2 always runs the fast driver src/drivers/GxEPD2_579_Fast (a copy of
; GxEPD2's stock GxEPD2_579_GDEY0579T93 with speed read hooks; the stock
; class is no longer used for it, and the old PANEL2_FAST_DRIVER flag is gone).
; Speed read drives it from the Normal / Turbo speed profiles in
; src/panel.cpp (src/speed_profile.h); outside speed read it refreshes as the
; stock driver does.
[env:esp32s3_579]
extends = env:esp32s3
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    ${env:esp32s3.build_flags}
    -DDEFAULT_PANEL_ID=2
    -DPINS_WIDE=1

; Alias of [env:esp32s3_579], kept because the build guide and installer
; README name it. Since 2026-11-08 the plain wide build already runs the fast
; panel 2 driver, so this adds nothing.
[env:esp32s3_579_fast]
extends = env:esp32s3_579

; The founder's own v4 wide reader: [env:esp32s3_579] plus FOUNDER_UNIT=1,
; which turns on the remaps that exist only because of how that unit was
; built (include/pins.h PAD_LEFT_OFF and PAD_FLIP, the speed read DOWN-faster
; swap in src/rsvp.cpp). A reader wired as the build guide documents uses
; [env:esp32s3_579] instead.
; 2026-11-09: the founder's unit reads correctly on
; plain [env:esp32s3_579]: directions match and LEFT works. This env is no
; longer flashed to it; kept only until the remaps are removed.
[env:esp32s3_579_founder]
extends = env:esp32s3_579
build_flags =
    ${env:esp32s3_579.build_flags}
    -DFOUNDER_UNIT=1

; Bench test for the PCM5102A I2S DAC on the wide reader: builds only
; src/dac_tone_test.cpp (tone sweep, both channels, then L, then R). Not the reader.
[env:dac_tone]
extends = env:esp32s3_579
build_flags =
    ${env:esp32s3_579.build_flags}
    -DDAC_TONE_TEST=1
build_src_filter = -<*> +<dac_tone_test.cpp>

; Bench test for the wide reader's buttons: builds only src/btn_test.cpp,
; which prints every d-pad and shoulder key press/release over USB serial.
; Not the reader; back to the reader with `pio run -e esp32s3_579 -t upload`.
[env:btn_test]
extends = env:esp32s3_579
build_flags =
    ${env:esp32s3_579.build_flags}
    -DBTN_TEST=1
build_src_filter = -<*> +<btn_test.cpp>
